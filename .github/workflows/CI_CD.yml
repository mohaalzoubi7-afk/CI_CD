name: CI_CD Pipelines

on:
  push:
     branches:
         - master 

jobs:
    build-push:
      name: Build and Push
      runs-on: ['self-hosted' , 'linux' , 'x64'] 

      steps:
          - name: Checkout the code
            uses: actions/checkout@v7.0.1
        
          - name: Set up python
            uses: actions/setup-python@v7.0.0
            with:
              python-version: '3.14'

          - name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

          - name: Unit Test
            run: |
                python manage.py test
  
          - name: Login to the Docker Hub
            uses: docker/login-action@v4.6.0
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

          - name: Setup the Buildx docker 
            uses: docker/setup-buildx-action@v4.4.1


          # - name: Get Date
          #   run: echo "DATE=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV    

          - name: Build and Push Docker Images
            uses: docker/build-push-action@v7.4.0
            with:
               context: .
               dockerfile: Dockerfile
               push: true
               tags: ${{ secrets.DOCKER_USERNAME }}/django-app:latest
    

    Deployment:
       name: Deploy to the server
       needs: build-push 
       runs-on: ['self-hosted' , 'linux' , 'x64'] 
       
       steps:
           - name: Login to Docker Hub  
             uses: docker/login-action@v4.6.0
             with: 
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} 

          #  - name: Get Date
          #    run: echo "DATE=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV     

           - name: Pull and Run the Image from Docker  
             run: |
                docker run -d --name djangoapp -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/django-app:latest 

           - name: Check the App 
             run: | 
                 docker ps 
                 sleep 5 
                 curl http://localhost:8000 
                           